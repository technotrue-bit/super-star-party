<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUPER STAR PARTY — build progress</title>
    <style>
      :root {
        --ink: #2b1d4e;
        --cream: #fff6e5;
        --sun: #ffd23f;
        --candy: #ff4f9a;
        --mint: #2ee6a8;
        --lava: #ff5a3c;
        --bubble: #3fd6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--ink); color: var(--cream);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif; padding: 24px;
      }
      h1 {
        font-size: 34px; margin: 0 0 4px; color: var(--sun);
        text-shadow: 0 3px 0 rgba(0,0,0,.35); letter-spacing: 1px;
      }
      .sub { opacity: .7; margin-bottom: 20px; font-size: 14px; }
      .status-line {
        background: rgba(255,255,255,.08); border-radius: 12px; padding: 12px 16px;
        margin-bottom: 22px; font-size: 15px; border-left: 5px solid var(--sun);
      }
      .wave {
        background: rgba(255,255,255,.05); border-radius: 14px; padding: 14px 16px;
        margin-bottom: 14px; border: 1px solid rgba(255,255,255,.1);
      }
      .wave h2 {
        font-size: 17px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px;
      }
      .badge {
        font-size: 11px; padding: 2px 10px; border-radius: 999px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .5px;
      }
      .b-done { background: var(--mint); color: var(--ink); }
      .b-building { background: var(--sun); color: var(--ink); animation: pulse 1.4s infinite; }
      .b-planned { background: rgba(255,255,255,.14); color: var(--cream); }
      .b-critic { background: var(--candy); color: #fff; }
      .b-fail { background: var(--lava); color: #fff; }
      .piece {
        display: flex; align-items: center; gap: 10px; padding: 5px 0;
        font-size: 14px; border-bottom: 1px dashed rgba(255,255,255,.08);
      }
      .piece:last-child { border-bottom: none; }
      .p-num {
        min-width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.1);
        display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
      }
      .p-detail { opacity: .55; font-size: 12px; margin-left: auto; text-align: right; max-width: 45%; }
      .critic-rounds { margin-top: 22px; }
      .critic-rounds h2 { font-size: 16px; }
      .round { font-size: 13px; padding: 4px 0; opacity: .85; }
      .round b { color: var(--sun); }
      .links { margin-top: 26px; font-size: 13px; opacity: .75; }
      .links a { color: var(--bubble); }
      .updated { float: right; font-size: 12px; opacity: .5; margin-top: 8px; }
      @keyframes pulse { 50% { opacity: .55; } }
    </style>
  </head>
  <body>
    <h1>⭐ SUPER STAR PARTY</h1>
    <div class="sub">Build progress — Mario Party 7 quality bar · builder/critic loops · live</div>
    <div id="status" class="status-line">Loading…</div>
    <div id="waves"></div>
    <div id="critics" class="critic-rounds"><h2>🧐 Critic rounds</h2></div>
    <div class="links" id="links"></div>
    <div class="updated" id="updated"></div>
    <script>
      const stateColor = (s) =>
        s === "done" ? "b-done" : s === "building" ? "b-building" : s === "critic" ? "b-critic" : s === "fail" ? "b-fail" : "b-planned";
      const stateLabel = (s) =>
        s === "done" ? "done" : s === "building" ? "building" : s === "critic" ? "critic" : s === "fail" ? "gap → fix" : "planned";
      async function load() {
        try {
          const r = await fetch("/progress.json?t=" + Date.now());
          const d = await r.json();
          document.getElementById("status").textContent = "▶ " + d.status;
          const waves = document.getElementById("waves");
          waves.innerHTML = "";
          for (const w of d.waves) {
            const div = document.createElement("div");
            div.className = "wave";
            div.innerHTML = `<h2>${w.id} — ${w.name} <span class="badge ${stateColor(w.status)}">${stateLabel(w.status)}</span></h2>`;
            for (const p of w.pieces) {
              const row = document.createElement("div");
              row.className = "piece";
              row.innerHTML = `<span class="p-num">${p.id}</span><span>${p.name}</span>
                <span class="badge ${stateColor(p.status)}">${stateLabel(p.status)}</span>
                <span class="p-detail">${p.detail || ""}</span>`;
              div.appendChild(row);
            }
            waves.appendChild(div);
          }
          const critics = document.getElementById("critics");
          critics.innerHTML = "<h2>🧐 Critic rounds</h2>";
          if (!d.criticRounds || !d.criticRounds.length) {
            critics.innerHTML += '<div class="round" style="opacity:.5">No verdicts yet — critics dispatch after Wave 1 lands.</div>';
          } else {
            for (const c of d.criticRounds) {
              const row = document.createElement("div");
              row.className = "round";
              row.innerHTML = `<b>${c.piece}</b> · round ${c.round} · <span style="color:${c.pass ? "var(--mint)" : "var(--lava)"}">${c.pass ? "PASS ✓" : "FAIL — " + c.gap}</span>`;
              critics.appendChild(row);
            }
          }
          const links = document.getElementById("links");
          links.innerHTML = `Game: <a href="${d.urls.game}" target="_blank">${d.urls.game}</a> · Showcase: <a href="${d.urls.showcase}" target="_blank">${d.urls.showcase}</a> · Plan: <a href="/PLAN.md" target="_blank">PLAN.md</a> · Quality bar: <a href="/refs/QUALITY_BAR.md" target="_blank">QUALITY_BAR.md</a>`;
          document.getElementById("updated").textContent = "updated " + d.updated;
        } catch (e) {
          document.getElementById("status").textContent = "progress.json not reachable yet — " + e;
        }
      }
      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
