name: check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start the game
        run: |
          RUNNER_TRACKING_ID="" nohup npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 < /dev/null &
          disown
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5177/; then
              exit 0
            fi
            sleep 1
          done
          echo "The game did not listen on port 5177."
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Twin match
        run: node tools/twin-seed.mjs

      - name: Playtest
        run: node tools/smoke-play.mjs
